name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q libpq-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Test with pytest
      env:
        PYTHONPATH: .
        # Provide dummy values so imports don't fail at collection time
        VAPI_API_KEY: test_key
        VAPI_PHONE_NUMBER_ID: test_phone_id
        VAPI_ASSISTANT_ID: test_assistant_id
        PUBLIC_WEBHOOK_URL: http://localhost:8000
        # Empty Redis vars — conftest.py disables Redis for tests
        UPSTASH_REDIS_REST_URL: ""
        UPSTASH_REDIS_REST_TOKEN: ""
      run: pytest
